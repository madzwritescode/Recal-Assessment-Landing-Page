<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recal Breath Assessment</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: transparent;
            padding: 0;
            margin: 0;
        }

        /* Custom Font - Fallback to system fonts if font file not available */
        @font-face {
            font-family: 'Rogue Sans Ext';
            src: url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');
            font-weight: 700;
            font-style: italic;
        }

        /* Form Container */
        .recal-form-container {
            background: white;
            border-radius: 12px;
            border: 2px solid #4A90A4;
            padding: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            width: 100%;
        }

        .recal-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Name Row */
        .recal-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Input Fields */
        .recal-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #0A4367;
            border-radius: 8px;
            font-size: 16px;
            height: 43px;
            font-family: 'Rogue Sans Ext', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-style: italic;
            font-weight: 700;
            transition: all 0.2s;
        }

        .recal-input:focus {
            outline: none;
            border-color: #0A4367;
            box-shadow: 0 0 0 2px rgba(10, 67, 103, 0.2);
        }

        .recal-input::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        /* Button */
        .recal-button {
            width: 100%;
            padding: 12px 24px;
            background-color: #0A4367;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            height: 45px;
            cursor: pointer;
            font-family: 'Rogue Sans Ext', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-style: italic;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            transition: opacity 0.2s;
        }

        .recal-button:hover {
            opacity: 0.9;
        }

        .recal-button:active {
            opacity: 0.8;
        }

        .recal-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Fine Print */
        .recal-fine-print {
            text-align: center;
            font-size: 12px;
            color: #6b7280;
            font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
        }

        .recal-subtitle {
            text-align: center;
            font-size: 14px;
            color: #0A4367;
            font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 500;
            font-style: italic;
            margin: 0;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .recal-form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Loading State */
        .recal-loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="recal-form-container">
        <form id="recalForm" class="recal-form">
            <!-- Name Row -->
            <div class="recal-form-row">
                <input
                    type="text"
                    name="firstName"
                    id="firstName"
                    placeholder="First Name"
                    class="recal-input"
                    required
                />
                <input
                    type="text"
                    name="lastName"
                    id="lastName"
                    placeholder="Last Name"
                    class="recal-input"
                />
            </div>

            <!-- Email Input -->
            <input
                type="email"
                name="email"
                id="email"
                placeholder="Email"
                class="recal-input"
                required
            />

            <!-- CTA Button -->
            <button type="submit" class="recal-button" id="submitButton">
                Start My Assessment
            </button>

            <!-- Time estimate fine print -->
            <p class="recal-fine-print">
                Takes 5-10 minutes on average to complete
            </p>

            <!-- Subtitle -->
            <p class="recal-subtitle">
                Your info will never be shared with anyone. No Credit card required.
            </p>
        </form>
    </div>

    <script>
        (function() {
            // Get configuration from URL parameters or window config
            const urlParams = new URLSearchParams(window.location.search);
            const getBaseUrl = () => {
                // Try query parameter first (for iframe embedding)
                if (urlParams.get('baseUrl')) {
                    return urlParams.get('baseUrl');
                }
                // Try window config (for script embedding)
                if (window.RECAL_FORM_CONFIG?.baseUrl) {
                    return window.RECAL_FORM_CONFIG.baseUrl;
                }
                // Try to infer from current location (if same origin)
                if (window.location.origin) {
                    return window.location.origin;
                }
                // Fallback
                return 'https://yourdomain.com';
            };

            // Configuration - Update these for your deployment
            // Default GA ID (Recal's main tracking) - use partner's ID if provided, otherwise use default
            const DEFAULT_GA_ID = 'G-TZ8Y3WV5HP';
            const CONFIG = {
                // Base URL of your Next.js app (e.g., 'https://yourdomain.com' or 'http://localhost:3000')
                baseUrl: getBaseUrl(),
                // Google Analytics 4 tracking ID - Company-specific or default
                // Pass via URL: ?gaId=G-XXXXXXXXXX
                gaId: urlParams.get('gaId') || window.RECAL_FORM_CONFIG?.gaId || DEFAULT_GA_ID,
                // Company name for tracking (optional)
                companyName: urlParams.get('company') || window.RECAL_FORM_CONFIG?.companyName || 'Unknown',
                // Google Form URL
                googleFormUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSfdvHwTAuYDUZrqKntNaIcZbNM_RPothRiZgcMbwFPeb8Mx0A/viewform',
                // Google Form entry IDs
                formEntryIds: {
                    firstName: 'entry.1328606392',
                    lastName: 'entry.343152274',
                    email: 'entry.1362361142'
                }
            };

            // Initialize Google Analytics 4
            function initGA4() {
                if (!CONFIG.gaId) return;
                
                // Check if GA4 is already loaded
                if (window.gtag && window.dataLayer) {
                    // GA4 already initialized, just configure this tracking ID
                    window.gtag('config', CONFIG.gaId);
                    // Track widget view after GA is ready
                    setTimeout(() => trackWidgetView(), 100);
                    return;
                }

                // Load GA4 script dynamically
                window.dataLayer = window.dataLayer || [];
                function gtag(){window.dataLayer.push(arguments);}
                window.gtag = gtag;
                window.gtag('js', new Date());
                window.gtag('config', CONFIG.gaId);

                // Load the gtag.js script
                const script = document.createElement('script');
                script.async = true;
                script.src = 'https://www.googletagmanager.com/gtag/js?id=' + CONFIG.gaId;
                script.onload = function() {
                    // Track widget view after GA script loads
                    trackWidgetView();
                };
                document.head.appendChild(script);
            }

            // Track widget view event
            function trackWidgetView() {
                if (CONFIG.gaId && typeof window.gtag !== 'undefined') {
                    window.gtag('event', 'widget_view', {
                        event_category: 'Engagement',
                        event_label: 'Form Widget Loaded',
                        category: 'Engagement',
                        label: 'Form Widget Loaded',
                        company_name: CONFIG.companyName,
                        company: CONFIG.companyName,
                        value: 1,
                    });
                }
            }

            // Initialize GA4 on load
            initGA4();

            // Track event helper with GA4-native parameters
            function trackEvent(action, category, label, value) {
                if (CONFIG.gaId && typeof window.gtag !== 'undefined') {
                    window.gtag('event', action, {
                        // GA4 custom parameters
                        category: category,
                        label: label,
                        company_name: CONFIG.companyName,
                        company: CONFIG.companyName,
                        // Legacy parameters for backward compatibility
                        event_category: category,
                        event_label: label,
                        ...(value !== undefined && { value: value }),
                    });
                }
            }

            // Record signup to API
            async function recordSignup(firstName, lastName, email) {
                try {
                    const response = await fetch(`${CONFIG.baseUrl}/api/record-landing-signup`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            firstName: firstName,
                            lastName: lastName || '',
                            email: email,
                        }),
                    });

                    if (response.ok) {
                        console.log('Signup recorded successfully');
                    } else {
                        console.error('Failed to record signup');
                    }
                } catch (error) {
                    console.error('Error recording signup:', error);
                    // Don't block form submission if API call fails
                }
            }

            // Handle form submission
            const form = document.getElementById('recalForm');
            const submitButton = document.getElementById('submitButton');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Get form data
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const email = document.getElementById('email').value.trim();

                // Validate
                if (!firstName || !email) {
                    alert('Please fill in all required fields.');
                    return;
                }

                // Disable form during submission
                form.classList.add('recal-loading');
                submitButton.disabled = true;
                submitButton.textContent = 'Opening Assessment...';

                // Track conversion
                trackEvent('start_assessment_click', 'Conversion', 'Embedded Form CTA', 1);

                // Record signup (async, don't wait)
                recordSignup(firstName, lastName, email).catch(console.error);

                // Build Google Form URL with pre-filled data
                const url = new URL(CONFIG.googleFormUrl);
                url.searchParams.append(CONFIG.formEntryIds.firstName, firstName);
                if (lastName) {
                    url.searchParams.append(CONFIG.formEntryIds.lastName, lastName);
                }
                url.searchParams.append(CONFIG.formEntryIds.email, email);

                // Open Google Form in new tab
                window.open(url.toString(), '_blank');

                // Reset form after a short delay
                setTimeout(() => {
                    form.reset();
                    form.classList.remove('recal-loading');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Start My Assessment';
                }, 1000);
            });
        })();
    </script>
</body>
</html>
