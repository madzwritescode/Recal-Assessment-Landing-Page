<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recal Breath Assessment</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: transparent;
            padding: 0;
            margin: 0;
            color: #0A4367;
        }

        .recal-widget-shell {
            background: linear-gradient(135deg, #f7f8ff, #eef4ff);
            border-radius: 30px;
            padding: 6px;
            border: 2px solid #d9c3ff;
            box-shadow: 0 15px 45px rgba(133, 96, 169, 0.25);
        }

        .recal-form-card {
            background: linear-gradient(160deg, #ffffff 0%, #f2f7ff 100%);
            border-radius: 25px;
            padding: 24px;
            box-shadow: 0 25px 55px rgba(12, 48, 82, 0.18);
        }

        .recal-brand-header {
            background: linear-gradient(120deg, #0A4367, #0F5C89 60%, #4A90A4);
            border-radius: 18px;
            padding: 18px 22px;
            margin-bottom: 20px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 12px 35px rgba(10, 67, 103, 0.4);
            color: #ffffff;
        }

        .recal-brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .recal-brand-logo img {
            height: 30px;
            width: auto;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.4));
        }

        .recal-brand-logo span {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .recal-tagline {
            font-size: 15px;
            color: rgba(10, 67, 103, 0.82);
            margin-bottom: 22px;
            font-weight: 600;
        }

        .recal-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Name Row */
        .recal-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Input Fields */
        .recal-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(8, 63, 107, 0.9);
            border-radius: 16px;
            font-size: 16px;
            height: 52px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.92);
            color: #0A4367;
            box-shadow: 0 6px 15px rgba(10, 67, 103, 0.08);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .recal-input:focus {
            outline: none;
            border-color: #0F5C89;
            box-shadow: 0 0 0 3px rgba(15, 92, 137, 0.15);
        }

        .recal-input::placeholder {
            color: #9fb3c6;
            font-weight: 500;
        }

        .recal-button {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(120deg, #06355C, #0B4D7C);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            height: 54px;
            cursor: pointer;
            box-shadow: 0 18px 30px rgba(6, 53, 92, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .recal-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 20px 32px rgba(6, 53, 92, 0.4);
        }

        .recal-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .recal-fine-print {
            text-align: center;
            font-size: 12px;
            color: #7a8595;
            margin: 0;
        }

        .recal-subtitle {
            text-align: center;
            font-size: 14px;
            color: #0A4367;
            font-weight: 600;
            font-style: italic;
            margin: 4px 0 0;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .recal-form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Loading State */
        .recal-loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="recal-widget-shell">
        <div class="recal-form-card">
            <div class="recal-brand-header">
                <div class="recal-brand-logo">
                    <img src="/assets/recal-embed-logo.png" alt="Recal logo" />
                    <span>Recal Breath Assessment</span>
                </div>
            </div>
            <div class="recal-form-content">
                <p class="recal-tagline">Instant breathing diagnostics designed for elite performance.</p>
                <form id="recalForm" class="recal-form">
                    <div class="recal-form-row">
                        <input
                            type="text"
                            name="firstName"
                            id="firstName"
                            placeholder="First Name"
                            class="recal-input"
                            required
                        />
                        <input
                            type="text"
                            name="lastName"
                            id="lastName"
                            placeholder="Last Name"
                            class="recal-input"
                        />
                    </div>
                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Email"
                        class="recal-input"
                        required
                    />
                    <button type="submit" class="recal-button" id="submitButton">
                        Start My Assessment
                    </button>
                    <p class="recal-fine-print">
                        Takes 5-10 minutes on average to complete
                    </p>
                    <p class="recal-subtitle">
                        Your info will never be shared with anyone. No Credit card required.
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // Get configuration from URL parameters or window config
            const urlParams = new URLSearchParams(window.location.search);
            const getBaseUrl = () => {
                // Try query parameter first (for iframe embedding)
                if (urlParams.get('baseUrl')) {
                    return urlParams.get('baseUrl');
                }
                // Try window config (for script embedding)
                if (window.RECAL_FORM_CONFIG?.baseUrl) {
                    return window.RECAL_FORM_CONFIG.baseUrl;
                }
                // Try to infer from current location (if same origin)
                if (window.location.origin) {
                    return window.location.origin;
                }
                // Fallback
                return 'https://yourdomain.com';
            };

            // Configuration - Update these for your deployment
            // Default GA ID (Recal's main tracking) - use partner's ID if provided, otherwise use default
            const DEFAULT_GA_ID = 'G-TZ8Y3WV5HP';
            const CONFIG = {
                // Base URL of your Next.js app (e.g., 'https://yourdomain.com' or 'http://localhost:3000')
                baseUrl: getBaseUrl(),
                // Google Analytics 4 tracking ID - Company-specific or default
                // Pass via URL: ?gaId=G-XXXXXXXXXX
                gaId: urlParams.get('gaId') || window.RECAL_FORM_CONFIG?.gaId || DEFAULT_GA_ID,
                // Company name for tracking (optional)
                companyName: urlParams.get('company') || window.RECAL_FORM_CONFIG?.companyName || 'Unknown',
                // Google Form URL
                googleFormUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSfdvHwTAuYDUZrqKntNaIcZbNM_RPothRiZgcMbwFPeb8Mx0A/viewform',
                // Google Form entry IDs
                formEntryIds: {
                    firstName: 'entry.1328606392',
                    lastName: 'entry.343152274',
                    email: 'entry.1362361142'
                }
            };

            // Initialize Google Analytics 4
            function initGA4() {
                if (!CONFIG.gaId) return;
                
                // Check if GA4 is already loaded
                if (window.gtag && window.dataLayer) {
                    // GA4 already initialized, just configure this tracking ID
                    window.gtag('config', CONFIG.gaId);
                    // Track widget view after GA is ready
                    setTimeout(() => trackWidgetView(), 100);
                    return;
                }

                // Load GA4 script dynamically
                window.dataLayer = window.dataLayer || [];
                function gtag(){window.dataLayer.push(arguments);}
                window.gtag = gtag;
                window.gtag('js', new Date());
                window.gtag('config', CONFIG.gaId);

                // Load the gtag.js script
                const script = document.createElement('script');
                script.async = true;
                script.src = 'https://www.googletagmanager.com/gtag/js?id=' + CONFIG.gaId;
                script.onload = function() {
                    // Track widget view after GA script loads
                    trackWidgetView();
                };
                document.head.appendChild(script);
            }

            // Track widget view event
            function trackWidgetView() {
                if (CONFIG.gaId && typeof window.gtag !== 'undefined') {
                    window.gtag('event', 'widget_view', {
                        event_category: 'Engagement',
                        event_label: 'Form Widget Loaded',
                        category: 'Engagement',
                        label: 'Form Widget Loaded',
                        company_name: CONFIG.companyName,
                        company: CONFIG.companyName,
                        value: 1,
                    });
                }
            }

            // Initialize GA4 on load
            initGA4();

            // Track event helper with GA4-native parameters
            function trackEvent(action, category, label, value) {
                if (CONFIG.gaId && typeof window.gtag !== 'undefined') {
                    window.gtag('event', action, {
                        // GA4 custom parameters
                        category: category,
                        label: label,
                        company_name: CONFIG.companyName,
                        company: CONFIG.companyName,
                        // Legacy parameters for backward compatibility
                        event_category: category,
                        event_label: label,
                        ...(value !== undefined && { value: value }),
                    });
                }
            }

            // Record signup to API
            async function recordSignup(firstName, lastName, email) {
                try {
                    const response = await fetch(`${CONFIG.baseUrl}/api/record-landing-signup`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            firstName: firstName,
                            lastName: lastName || '',
                            email: email,
                        }),
                    });

                    if (response.ok) {
                        console.log('Signup recorded successfully');
                    } else {
                        console.error('Failed to record signup');
                    }
                } catch (error) {
                    console.error('Error recording signup:', error);
                    // Don't block form submission if API call fails
                }
            }

            // Handle form submission
            const form = document.getElementById('recalForm');
            const submitButton = document.getElementById('submitButton');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                // Get form data
                const firstName = document.getElementById('firstName').value.trim();
                const lastName = document.getElementById('lastName').value.trim();
                const email = document.getElementById('email').value.trim();

                // Validate
                if (!firstName || !email) {
                    alert('Please fill in all required fields.');
                    return;
                }

                // Disable form during submission
                form.classList.add('recal-loading');
                submitButton.disabled = true;
                submitButton.textContent = 'Opening Assessment...';

                // Track conversion
                trackEvent('start_assessment_click', 'Conversion', 'Embedded Form CTA', 1);

                // Record signup (async, don't wait)
                recordSignup(firstName, lastName, email).catch(console.error);

                // Build Google Form URL with pre-filled data
                const url = new URL(CONFIG.googleFormUrl);
                url.searchParams.append(CONFIG.formEntryIds.firstName, firstName);
                if (lastName) {
                    url.searchParams.append(CONFIG.formEntryIds.lastName, lastName);
                }
                url.searchParams.append(CONFIG.formEntryIds.email, email);

                // Open Google Form in new tab
                window.open(url.toString(), '_blank');

                // Reset form after a short delay
                setTimeout(() => {
                    form.reset();
                    form.classList.remove('recal-loading');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Start My Assessment';
                }, 1000);
            });
        })();
    </script>
</body>
</html>
